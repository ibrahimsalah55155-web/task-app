      var vis = function () { return me.role === 'admin' ? T : T.filter(function (t) { return !t.assigned_to || t.assigned_to === me.id; }); };
      var nid = 100;
      window.__mock = { T: T, P: P, A: A };
      window.__INJAZ_TEST_API__ = {
        getSession: function () { return delay(signed ? { user: { id: me.id } } : null, 50); },
        onAuthChange: function () { return function () {}; },
