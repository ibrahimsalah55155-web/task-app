name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', 'android-res/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: App icons
        run: cp -r android-res/. android/app/src/main/res/

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../injaz.apk

      - name: Keep build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: injaz-apk
          path: injaz.apk

      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest injaz.apk \
            --title "إنجاز - أحدث نسخة أندرويد" \
            --notes "حمّل injaz.apk من هنا وافتحه على الموبايل لتثبيت التطبيق. النسخة من: ${GITHUB_SHA::7}" \
            --latest
