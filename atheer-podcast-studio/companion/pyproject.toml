[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atheer-companion"
version = "0.4.1"
description = "Local processing service for the ATHEER PODCAST STUDIO Premiere Pro panel"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=13,<16",
  # graphics renderer (Motion Library): Arabic shaping + rasterising + compositing
  "numpy>=1.26",
  "Pillow>=10",
  "uharfbuzz>=0.40",
  "freetype-py>=2.4",
  # analysis (sync, silence, director, captions, reels)
  "scipy>=1.11",
  "onnxruntime>=1.17",
  "faster-whisper>=1.1",
  "opencv-python-headless>=4.9",
  # finishing: speaker separation on one mic, caption translation
  "sherpa-onnx>=1.12",
  "sentencepiece>=0.2",
  "ctranslate2>=4.4",
]

[project.optional-dependencies]
# Phase 1 needs none of these. They are listed so later phases install from one place.
# Each one is evaluated in docs/FEASIBILITY_AUDIT.md before it becomes a hard requirement.
ai = []
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
atheer-companion = "atheer_companion.__main__:main"

[tool.setuptools.packages.find]
include = ["atheer_companion*"]

[tool.setuptools.package-data]
"atheer_companion.graphics" = ["fonts/*.ttf", "fonts/OFL.txt"]
"atheer_companion.analysis" = ["models/*.onnx", "models/*.txt", "models/*.rnnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
