<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>إنجاز</title>
  <meta name="description" content="متابعة مهام الفريق وإنجازها">
  <meta name="theme-color" content="#0C0D0F">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="إنجاز">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plex-arabic-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint.
    var t = 'dark'; try { if (localStorage.getItem('injaz.theme') === 'light') t = 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  </script>
</head>
<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <div id="root"></div>
  <div id="layers"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="banners" aria-live="polite"></div>
  <noscript>يحتاج هذا التطبيق إلى تفعيل JavaScript.</noscript>
  <script src="vendor/supabase-2.118.0.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    // Offline shell for the web version only; the Android app already ships its files.
    if ('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'localhost') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
